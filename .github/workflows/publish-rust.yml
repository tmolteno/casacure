# Publishes the `casacure` Rust crate to crates.io using crates.io trusted
# publishing (OpenID Connect) — no long-lived crates.io API token is stored
# in this repo. A temporary, scoped token is minted per-run by
# `rust-lang/crates-io-auth-action` and revoked automatically when the job
# finishes.
#
# One-time setup in crates.io (https://crates.io -> Account settings ->
# Publishing -> "Add a trusted publisher"), done once by the crate owner:
#   * Repository:  tmolteno/casacure
#   * Workflow:    Publish Rust crate        (this workflow's `name:`)
#   * Environment: crates-io                 (this workflow's environment)
#   * (optional) Tag filter: v*
#
# The publishing account must own the `casacure` crate. See
# https://crates.io/docs/trusted-publishing for details; the workflow follows
# the official pattern (job with `environment:` + `id-token: write`, then the
# crates-io-auth-action).
name: Publish Rust crate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish casacure to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The release tag must match the crate version (both in the Git tag
      # `v<version>` and in the workspace `Cargo.toml`). The crates.io
      # `casacure` crate intentionally stays at the three-part interface
      # version (3.8.1), so four-part *wheel* releases (3.8.1.n) tag a Python
      # release, not a new crate: a tag that does not match the crate version
      # is a wheel-only release and skips the crates.io publish instead of
      # failing.
      - name: Classify the release (crate bump vs wheel-only)
        id: classify
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "casacure") | .version'
          )"
          if [ "$tag" = "$version" ]; then
            echo "tag v$tag matches casacure crate version '$version'; publishing"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag v$tag: crates.io crate stays '$version' (wheel-only release); skipping publish"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Exchange the GitHub OIDC token for a short-lived crates.io API token.
      - name: Authenticate with crates.io (trusted publishing)
        if: steps.classify.outputs.should_publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        if: steps.classify.outputs.should_publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p casacure
