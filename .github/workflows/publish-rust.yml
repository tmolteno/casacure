# Publishes the `casacure` Rust crate to crates.io.
#
# crates.io does not support GitHub trusted publishing, so a token is
# required: add a repository secret named `CARGO_REGISTRY_TOKEN` set to a
# crates.io API token (https://crates.io/settings/tokens) scoped to the
# `casacure` crate.
name: Publish Rust crate

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish casacure to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The release tag must match the crate version (both in the Git tag
      # `v<version>` and in the workspace `Cargo.toml`).
      - name: Require the tag to match the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "casacure") | .version'
          )"
          if [ "$tag" != "$version" ]; then
            echo "tag 'v$tag' does not match casacure crate version '$version'" >&2
            exit 1
          fi

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p casacure
