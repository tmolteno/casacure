# Publishes the `casacure` Python package to PyPI using GitHub trusted
# publishing (OpenID Connect) — no API token is stored in this repo.
#
# One-time setup in PyPI (pypi.org -> Account settings -> Publishing ->
# "Add a new publisher"), done once by the project owner:
#   * Owner:       tmolteno
#   * Repository:  casacure
#   * Workflow:    Publish Python package   (this workflow's `name:`)
#   * Environment: pypi                    (this workflow's environment)
#
# After that, every `v*` tag push (or manual dispatch) builds wheels for all
# supported platforms and CPython versions (3.9 through 3.14) and uploads
# them to the `casacure` project.
name: Publish Python package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cross-compile a wheel per platform/ABI.
  #
  # Linux: the manylinux image bundles every supported CPython (3.9-3.14), so
  # `--find-interpreter` covers all ABIs in one job per target; the sdist is
  # produced exactly once (the x86_64 Linux job).
  #
  # macOS: one job per CPython version on arm64 runners (3.10-3.14; 3.9 is
  # provided on Linux via manylinux). Intel-macOS (x86_64) wheels are not
  # built: GitHub no longer hosts Intel-mac runners; Intel Mac users install
  # the source distribution instead.
  build:
    name: Build wheels (${{ matrix.target }} ${{ matrix.python || 'manylinux' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            sdist: true
          - platform: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
            sdist: false
          - platform: macos-14
            target: aarch64-apple-darwin
            python: "3.10"
          - platform: macos-14
            target: aarch64-apple-darwin
            python: "3.11"
          - platform: macos-14
            target: aarch64-apple-darwin
            python: "3.12"
          - platform: macos-14
            target: aarch64-apple-darwin
            python: "3.13"
          - platform: macos-14
            target: aarch64-apple-darwin
            python: "3.14"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.10"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.11"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.12"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.13"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            python: "3.14"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Linux uses the full interpreter set inside the manylinux image;
          # macOS/Windows select one per matrix entry.
          python-version: ${{ matrix.python || '3.12' }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --find-interpreter
          sdist: ${{ matrix.sdist }}
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          # Same artifact name over all matrix jobs: GitHub merges same-name
          # uploads into ONE artifact (concurrent-upload merge, not the
          # download-side 'merge-multiple' that corrupts files).
          name: dist
          path: dist
          if-no-files-found: error

  # Collect every wheel plus the sdist and publish to PyPI with trusted
  # publishing. `id-token: write` mints the OIDC token; no password.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          # Single merged artifact: a plain download (no pattern /
          # merge-multiple) so wheel bytes are untouched.
          name: dist
          path: dist
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
