[package]
name = "casacure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["casacore", "measurement-set", "radio-astronomy", "taql"]

[dependencies]
libc = "0.2"
thiserror = "2"
memmap2 = "0.9"
# Astrometry engine for `measures` (IAU SOFA algorithms, pure Rust) and the
# bundled IERS Earth-orientation data they need for UTC->UT1.
sofars = { workspace = true }
celestial-eop-data = { workspace = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
