[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "casacure"
description = "A Rust replacement for the casacore table system, pip installable on any machine"
readme = "README.md"
license = { text = "LGPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dynamic = ["version"]

[tool.maturin]
manifest-path = "crates/casacure-python/Cargo.toml"
features = ["pyo3/extension-module"]
