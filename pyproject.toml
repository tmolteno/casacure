[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "casacure"
description = "A Rust replacement for the casacore table system, pip installable on any machine"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE*", "COPYING*", "NOTICE*"]
authors = [{ name = "Tim Molteno", email = "tim@elec.ac.nz" }]
keywords = [
    "casacore",
    "measurement-set",
    "radio-astronomy",
    "CASA",
    "AIPS",
    "taql",
    "fits",
    "scientific-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy"]
# Version A.B.P: A.B is the casacore interface version casacure mirrors
# (currently 3.8, i.e. any casacore 3.8.x) and P is casacure's own patch
# level (incremented on every fix/feature release, reset to 1 when the
# interface changes). The crates.io crate and this wheel share the same
# three-part A.B.P, so both are published together per release
# (see Cargo.toml [workspace.package]).
version = "3.8.8"

[project.scripts]
casacure-test = "casacure:run_tests"
casacure-bench = "casacure:run_benchmark"

[project.urls]
Homepage = "https://github.com/tmolteno/casacure"
Repository = "https://github.com/tmolteno/casacure"
Changelog = "https://github.com/tmolteno/casacure/blob/main/CHANGELOG.md"
Issues = "https://github.com/tmolteno/casacure/issues"

[tool.maturin]
manifest-path = "crates/casacure-python/Cargo.toml"
features = ["pyo3/extension-module"]
