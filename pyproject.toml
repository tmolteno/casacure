[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "casacure"
description = "A Rust replacement for the casacore table system, pip installable on any machine"
readme = "README.md"
requires-python = ">=3.9,<3.15"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE*", "COPYING*", "NOTICE*"]
authors = [{ name = "Tim Molteno", email = "tim@elec.ac.nz" }]
keywords = [
    "casacore",
    "measurement-set",
    "radio-astronomy",
    "CASA",
    "AIPS",
    "taql",
    "fits",
    "scientific-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy"]
# Wheel version <major>.<minor>.<patch>.<n>: the first three numbers follow
# the casacore interface version (3.8.1 == casacore 3.8.1); the fourth
# counts casacure fix/feature releases on top of that interface.
# Kept static because Cargo/semver forbids four-part versions: the crates.io
# `casacure` crate stays `3.8.1` (see Cargo.toml [workspace.package]).
version = "3.8.1.1"

[project.scripts]
casacure-test = "casacure:run_tests"
casacure-bench = "casacure:run_benchmark"

[project.urls]
Homepage = "https://github.com/tmolteno/casacure"
Repository = "https://github.com/tmolteno/casacure"
Changelog = "https://github.com/tmolteno/casacure/blob/main/CHANGELOG.md"
Issues = "https://github.com/tmolteno/casacure/issues"

[tool.maturin]
manifest-path = "crates/casacure-python/Cargo.toml"
features = ["pyo3/extension-module"]
